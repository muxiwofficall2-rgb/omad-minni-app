function go(){theme();clearInterval(S.iv);if(TEST)return app();if(std&&!S.tok&&hasN&&Notification.permission==='default'&&!LS.skip)return perm();if(!S.tok)return login();app()}
const lang=()=>`<div class="sg" style="margin:0">${['ru','uz','tk'].map(x=>`<button class="${S.l===x?'on':''}" data-a="lang" data-v="${x}">${x.toUpperCase()}</button>`).join('')}</div>`;
function perm(){V.innerHTML=`<div class="c"><div class="logo">${ic('bell',44)}</div><h1>${T('at')}</h1><p>${T('ad')}</p><button class="p" id="ok">${T('ab')}</button><button class="l" id="sk">${T('sk')}</button></div>`;$('#ok').onclick=async()=>{await Notification.requestPermission();go()};$('#sk').onclick=()=>{LS.skip=1;go()}}
function login(){V.innerHTML=`<div class="c"><div class="logo">${ic('fl',44)}</div><h1>${T('lt')}</h1><p>${T('ld')}</p><input id="p" type="tel" inputmode="tel" autocomplete="tel" placeholder="${T('ph')}" value="${S.ph}"><button class="p" id="s">${T('sc')}</button><div class="nt">${ic('shield',20)}<span>${T('sec')}</span></div><p id="h" style="color:#e5484d"></p>${lang()}</div>`;
$('#s').onclick=async()=>{S.ph=$('#p').value;try{const d=await api('auth',{action:'send',phone:S.ph});if(d.dev)console.log('DEV',d.dev);code()}catch(x){$('#h').textContent=T('er')}}}
function code(){V.innerHTML=`<div class="c"><div class="logo">${ic('shield',44)}</div><h1>${T('co')}</h1><p>${T('cd')}</p><input id="c" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" autofocus></div>`;
const ok=async v=>{try{const d=await api('auth',{action:'verify',phone:S.ph,code:v});LS.tok=S.tok=d.token;LS.ph=S.ph;if(hasN&&Notification.permission==='granted')sub();go()}catch(x){$('#c').value='';$('#c').placeholder=T('er')}};
$('#c').oninput=e=>{if(e.target.value.length===6)ok(e.target.value)};
if('OTPCredential' in window)navigator.credentials.get({otp:{transport:['sms']}}).then(o=>{$('#c').value=o.code;ok(o.code)}).catch(()=>{})}
function app(){V.innerHTML=`<div class="b${S.tab==='ch'?' f':''}" id="b"></div><nav><div>${['mn','ch','ca','se'].map(k=>`<button class="${S.tab===k?'on':''}" data-a="tab" data-v="${k}"><span>${ic(k,24)}</span>${T(k)}</button>`).join('')}</div></nav>`;clearInterval(S.iv);({mn:menu,ch:chat,ca:call,se:sets})[S.tab]();if(hasN&&Notification.permission==='granted'&&!S.sub)sub()}
function setup(){const g=hasN&&Notification.permission==='granted';if(std&&g)return'';const den=hasN&&Notification.permission==='denied',ac='--h1:var(--ac);--h2:var(--ac2)';
if(!std)return`<div class="cd" style="margin-top:14px"><div class="row"><span class="q" style="${ac}">${ic('dev',26)}</span><span><b>${T('it')}</b><small>${T('id')}</small></span></div>${ios?`<div class="step" style="margin-top:14px">${ic('share',26)}${T('g1')}</div><div class="step" style="margin-top:10px">${ic('plus',26)}${T('g2')}</div>`:dp?`<button class="p" style="margin-top:14px" data-a="inst">${ic('dev',22)}${T('ib')}</button>`:`<div class="step" style="margin-top:14px">${ic('dev',26)}${T('ga')}</div>`}</div>`;
return`<div class="cd" style="margin-top:14px"><div class="row"><span class="q" style="${ac}">${ic('bell',26)}</span><span><b>${T('at')}</b><small>${den?T('nd'):T('ad')}</small></span></div>${den?'':`<button class="p" style="margin-top:14px" data-a="push">${ic('bell',22)}${T('ab')}</button>`}</div>`}
function menu(){const sv=[['fl','#0b57ff','#00aaff'],['vi','#7c3aed','#c084fc'],['no','#f59e0b','#fbbf24'],['pr','#059669','#2dd4bf']];
$('#b').innerHTML=`<div class="hero"><div class="bg">${ic('fl',150)}</div><p style="font-weight:700">${T('hi')}</p><h1 style="margin-top:2px">${S.ph?'+'+S.ph.replace(/\D/g,''):'Omad Tour'}</h1><div class="pill"><span class="dot"></span>${T('on')}</div></div>${setup()}
<h3>${T('rq')}</h3><div class="cd"><div class="row"><div class="av">${ic('user',24)}</div><p style="font-weight:600">${T('ny')}</p></div><button class="p" style="margin-top:14px" data-a="tab" data-v="ch">${ic('ch',22)}${T('wc')}</button></div>
<h3 style="margin-top:6px">${T('sv')}</h3><div class="g">${sv.map(([k,a,b])=>`<button class="t" data-a="svc" data-v="${k}" style="--h1:${a};--h2:${b}"><span class="q">${ic(k,26)}</span><span><b>${T(k)}</b><small>${T(k+'d')}</small></span></button>`).join('')}</div>
<div class="cd nt" style="margin-top:14px">${ic('shield',22)}<span>${T('nt')}</span></div>`}
const tm=t=>new Date(t).toLocaleTimeString(S.l==='ru'?'ru-RU':'uz-UZ',{hour:'2-digit',minute:'2-digit'});
const shrink=f=>new Promise(r=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.78))};im.src=URL.createObjectURL(f)});
async function chat(){$('#b').innerHTML=`<div class="ch"><div class="av">${ic('fl',24)}</div><div><b>Omad Tour</b><small><span class="dot"></span>${T('cn')}</small></div></div><div class="ms" id="ms"></div>
<div class="cp">${['fl','vi','no','pr'].map(k=>`<button data-a="chip" data-v="${k}">${ic(k,18)}${T(k)}</button>`).join('')}</div>
<div class="cm"><label class="rb o" aria-label="photo">${ic('cam',22)}<input type="file" id="f" accept="image/*" hidden></label><input id="t" placeholder="${T('wr')}"><button class="rb s" id="x" aria-label="send">${ic('send',22)}</button></div>`;
if(S.pre){$('#t').value=S.pre;S.pre=''}
const mk=m=>{const d=document.createElement('div');d.className='m '+(m.from==='me'?'me':'ad');if(m.photo){const p=document.createElement('div');p.className='ph';p.innerHTML=ic('cam',18);p.append(T('ph2'));d.append(p)}if(m.text)d.append(m.text);if(m.t){const s=document.createElement('small');s.textContent=tm(m.t);d.append(s)}return d};
const load=async()=>{try{const d=await api('chat',{action:'list'});S.ph=d.phone;const ms=$('#ms');if(!ms)return;ms.replaceChildren(...(d.msgs.length?d.msgs:[{from:'ad',text:T('em')}]).map(mk));ms.scrollTop=1e9}catch(e){}};
const send=async(img)=>{const v=$('#t').value.trim();if(!v&&!img)return;$('#t').value='';try{await api('chat',{action:'send',text:v,img});load()}catch(e){$('#t').value=v}};
$('#x').onclick=()=>send();$('#t').onkeydown=e=>e.key==='Enter'&&send();
$('#f').onchange=async e=>{const f=e.target.files[0];if(f)send(await shrink(f));e.target.value=''};
load();S.iv=setInterval(load,5000)}
function call(){const rows=[['ca',T('cl'),C.phone,'tel:'+C.phone,'#16a34a'],['wa','WhatsApp',C.wa?'+'+C.wa:'','https://wa.me/'+C.wa,'#22c55e'],['tg','Telegram','@'+C.tg,'https://t.me/'+C.tg,'#229ed9'],['max','Max','max.ru',C.max,'#7c3aed']];
$('#b').innerHTML=`<h1 style="margin:4px 4px 16px">${T('ct')}</h1><div class="cd" style="padding:4px 18px">${rows.map(([i,n,s,h,c])=>`<a class="lk" href="${h}"><span class="q" style="--h1:${c};--h2:${c}">${ic(i,26)}</span><span><b>${n}</b><small>${s}</small></span>${ic('chev',20)}</a>`).join('')}</div>
<h3>${T('of')}</h3><div class="cd" style="padding:4px 18px">${[T('o1'),T('o2')].map(o=>`<div class="lk"><span class="ri">${ic('pin',22)}</span><b>${o}</b></div>`).join('')}</div>`}
function sets(){const g=hasN&&Notification.permission==='granted',sw=[['system','t0','linear-gradient(135deg,#0b57ff 50%,#131316 50%)'],['blue','t1','linear-gradient(135deg,#0b57ff,#00aaff)'],['green','t2','linear-gradient(135deg,#05100a,#2bdc86)'],['dark','t3','linear-gradient(135deg,#000,#6aa6ff)']];
$('#b').innerHTML=`<div class="cd"><div class="row"><div class="av">${ic('user',24)}</div><b style="font-size:19px;font-weight:800">${S.ph?'+'+S.ph.replace(/\D/g,''):'Omad Tour'}</b></div></div>
<div class="cd"><div class="r" style="border:0;padding-top:0"><span class="ri">${ic('globe',22)}</span>${T('la')}</div>${lang()}</div>
<div class="cd"><div class="r" style="border:0;padding-top:0"><span class="ri">${ic('pal',22)}</span>${T('th')}</div><div class="sw">${sw.map(([k,l,bg])=>`<button class="${S.t===k?'on':''}" data-a="th" data-v="${k}"><i style="background:${bg}"></i>${T(l)}</button>`).join('')}</div></div>
<button class="out" data-a="out">${ic('out',22)}${T('lo')}</button>`}
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a)return;const k=a.dataset.a,v=a.dataset.v;
if(k==='tab'){S.tab=v;app()}else if(k==='lang'){S.l=v;save();go()}else if(k==='th'){S.t=v;save();theme();app()}else if(k==='svc'){S.pre=T(v)+': ';S.tab='ch';app()}else if(k==='chip'){$('#t').value=T(v)+': ';$('#t').focus()}else if(k==='out')out();else if(k==='inst'&&dp)dp.prompt();else if(k==='push'&&hasN)Notification.requestPermission().then(()=>sub()).then(()=>app())});
document.addEventListener('click',e=>{if(e.target.closest('.hero')){std=!std;app()}});matchMedia('(prefers-color-scheme:dark)').onchange=theme;go();
</script></body></html>

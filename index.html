<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PIZZA CHICAGO — халяль пицца, Московский проспект 31, СПб</title>
<meta name="description" content="Пиццерия PIZZA CHICAGO в Санкт-Петербурге. 100% халяль. Доставка и самовывоз. Заказ через Telegram и WhatsApp.">
<meta name="theme-color" content="#B0723C">
<meta property="og:title" content="PIZZA CHICAGO — 100% халяль">
<meta property="og:description" content="Московский проспект, 31. Доставка и самовывоз.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23B0723C'/%3E%3Ctext x='16' y='23' font-size='17' text-anchor='middle' fill='%23fff' font-family='Arial' font-weight='bold'%3EC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ================================================================
   PIZZA CHICAGO — bitta fayl.
   Ekranlar: HOME (bosh sahifa) → MENU (alohida ekran) → ЗАКАЗ (4 qadam)
   Sozlamalar: <script> boshidagi CONFIG va MENU.
   ================================================================ */
:root{
  --bg:#F4F1ED;
  --card:#FFFFFF;
  --ink:#1E1712;
  --gray:#7A6E64;
  --line:#E4DCD3;
  --copper:#B0723C;
  --copper-d:#965D2B;
  --dark:#1E1712;
  --red:#C7462B;
  --green:#2E7D5B;
  --r:12px;
  --safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
body.locked{overflow:hidden}
img,svg{display:block}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--copper);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:10px;height:58px}
.hlogo{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.hlogo svg{width:30px;height:30px;flex:none;color:var(--copper)}
.hlogo b{font-size:16px;font-weight:800;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.langsw{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.langsw button{background:#fff;border:0;padding:7px 10px;font-size:12px;font-weight:700;color:var(--gray)}
.langsw button[aria-pressed="true"]{background:var(--copper);color:#fff}
.hcart{position:relative;background:var(--dark);color:#fff;border:0;border-radius:8px;padding:8px 11px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;flex:none}
.hcart svg{width:17px;height:17px}
.hcart[hidden]{display:none}

/* ---------- hero ---------- */
.hero{background:#fff;border-bottom:1px solid var(--line);text-align:center;padding:30px 0 28px}
.hero .em{width:96px;height:96px;margin:0 auto;color:var(--copper)}
.hero h1{margin:12px 0 0;font-size:clamp(26px,7.5vw,38px);font-weight:800;letter-spacing:.06em}
.hero p{margin:8px auto 0;max-width:36ch;font-size:14.5px;color:var(--gray)}
.halal{display:inline-flex;align-items:center;gap:7px;margin-top:14px;background:#EFF7F2;color:var(--green);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:700}
.halal svg{width:16px;height:16px}
.cta{display:grid;gap:10px;max-width:400px;margin:22px auto 0}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;border:0;border-radius:var(--r);padding:15px 20px;font-size:16px;font-weight:700;transition:opacity .15s}
.btn:active{opacity:.82}
.btn svg{width:19px;height:19px}
.btn-main{background:var(--copper);color:#fff;font-size:17px;padding:17px 20px}
.btn-dark{background:var(--dark);color:#fff}
.btn-out{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.4;pointer-events:none}

/* ---------- sections ---------- */
section.blk{padding:26px 0 0}
h2{margin:0 0 4px;font-size:21px;font-weight:800}
.sub{margin:0 0 14px;font-size:14px;color:var(--gray)}
.cards{display:grid;gap:10px}
@media(min-width:700px){.cards{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card .ic{width:28px;height:28px;color:var(--copper);margin-bottom:9px}
.card h3{margin:0 0 5px;font-size:16.5px;font-weight:700}
.card p{margin:0;font-size:14px;color:var(--gray)}
.card .lnk{display:inline-flex;align-items:center;gap:6px;margin-top:11px;font-size:14px;font-weight:700;color:var(--copper-d)}
.card .lnk svg{width:15px;height:15px}

/* steps how-to */
.how{display:grid;gap:10px;counter-reset:s}
@media(min-width:700px){.how{grid-template-columns:repeat(3,1fr)}}
.how div{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.how span.n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--copper);color:#fff;font-size:14px;font-weight:800;display:grid;place-items:center}
.how b{display:block;font-size:15px}
.how small{color:var(--gray);font-size:13.5px}

/* contact rows */
.crow{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;margin-bottom:9px}
.crow svg{width:23px;height:23px;flex:none;color:var(--copper)}
.crow b{display:block;font-size:15px;font-weight:700}
.crow span{display:block;font-size:12.5px;color:var(--gray)}

footer{margin-top:30px;background:#fff;border-top:1px solid var(--line);padding:22px 0 calc(22px + var(--safe))}
footer p{margin:0 0 8px;font-size:13px;color:var(--gray)}

/* ---------- full-screen panels (MENU / ЗАКАЗ) ---------- */
.panel{
  position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;
  background:var(--bg);transform:translateY(100%);
  transition:transform .26s cubic-bezier(.4,0,.2,1);visibility:hidden;
}
.panel.on{transform:translateY(0);visibility:visible}
.ptop{flex:none;display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line)}
.ptop .ti{flex:1;min-width:0}
.ptop .ti .where{font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--copper)}
.ptop .ti b{display:block;font-size:19px;font-weight:800;line-height:1.2}
.iconbtn{flex:none;width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);display:grid;place-items:center}
.iconbtn svg{width:19px;height:19px}
.pbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pfoot{flex:none;display:flex;align-items:center;gap:12px;padding:11px 14px calc(11px + var(--safe));background:#fff;border-top:1px solid var(--line)}
.pfoot .tot{flex:1;min-width:0}
.pfoot .tot b{display:block;font-size:17px;font-weight:800}
.pfoot .tot span{display:block;font-size:12.5px;color:var(--gray)}
.pfoot .btn{padding:13px 22px}

/* steps bar */
.stepbar{flex:none;display:flex;gap:5px;padding:9px 14px;background:#fff;border-bottom:1px solid var(--line)}
.stepbar i{flex:1;height:3px;border-radius:2px;background:var(--line)}
.stepbar i.done{background:var(--copper)}

/* ---------- menu list ---------- */
.filters{position:sticky;top:0;z-index:5;display:flex;gap:7px;overflow-x:auto;padding:11px 14px;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;color:var(--gray);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--dark);border-color:var(--dark);color:#fff}
.mlist{padding:12px 14px 20px;display:grid;gap:10px}
@media(min-width:700px){.mlist{grid-template-columns:1fr 1fr}}
@media(min-width:1000px){.mlist{grid-template-columns:1fr 1fr 1fr}}
.item{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column}
.item h3{margin:0;font-size:17px;font-weight:800;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.hot{font-size:11px;font-weight:800;color:var(--red);border:1px solid var(--red);border-radius:999px;padding:1px 6px}
.item .d{margin:5px 0 11px;font-size:13px;color:var(--gray)}
.sizes{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:11px}
.size{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 2px;text-align:center}
.size b{display:block;font-size:13px;font-weight:800}
.size span{display:block;font-size:11px;color:var(--gray)}
.size[aria-pressed="true"]{background:var(--dark);border-color:var(--dark)}
.size[aria-pressed="true"] b,.size[aria-pressed="true"] span{color:#fff}
.addrow{display:flex;align-items:center;gap:10px;margin-top:auto}
.price{flex:1;font-size:19px;font-weight:800}
.price i{font-style:normal;font-size:13px;font-weight:600;color:var(--gray)}
.add{background:var(--copper);color:#fff;border:0;border-radius:9px;padding:11px 16px;font-size:14px;font-weight:700}
.add:active{opacity:.82}

/* ---------- order ---------- */
.obody{padding:14px}
.line{display:flex;gap:11px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:9px}
.line .nm{flex:1;min-width:0}
.line .nm b{display:block;font-size:15px;font-weight:700}
.line .nm span{display:block;font-size:12.5px;color:var(--gray)}
.qty{display:flex;align-items:center;background:var(--bg);border-radius:9px;flex:none}
.qty button{width:32px;height:32px;background:none;border:0;font-size:18px;color:var(--ink);border-radius:9px}
.qty b{min-width:22px;text-align:center;font-size:15px}
.linesum{width:72px;text-align:right;font-size:15px;font-weight:800;flex:none}
.empty{text-align:center;padding:50px 16px;color:var(--gray)}
.empty svg{width:52px;height:52px;color:var(--line);margin:0 auto 12px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:5px}

.choice{width:100%;display:flex;gap:12px;align-items:center;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:10px}
.choice svg{width:26px;height:26px;color:var(--copper);flex:none}
.choice b{display:block;font-size:16px;font-weight:700}
.choice span{display:block;font-size:13px;color:var(--gray)}
.choice[aria-pressed="true"]{border-color:var(--copper);background:#FBF4EC}

label.f{display:block;margin-bottom:13px}
label.f .lb{display:block;font-size:13px;font-weight:600;color:var(--gray);margin-bottom:5px}
label.f input,label.f textarea{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;font-size:16px;font-family:inherit;color:var(--ink)}
label.f textarea{min-height:74px;resize:vertical}
label.f input:focus,label.f textarea:focus{border-color:var(--copper);outline:none}
label.f.bad input,label.f.bad textarea{border-color:var(--red)}
.err{display:none;color:var(--red);font-size:12.5px;margin-top:5px}
label.f.bad .err{display:block}
.paywrap{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}

.preview{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;font-size:13.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;max-height:250px;overflow-y:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.sendrow{display:grid;gap:9px;margin-top:14px}
.send{display:flex;align-items:center;gap:12px;border:0;border-radius:var(--r);padding:14px;font-size:15.5px;font-weight:700;color:#fff;text-align:left;width:100%}
.send svg{width:25px;height:25px;flex:none}
.send small{display:block;font-size:11.5px;font-weight:500;opacity:.9}
.s-tg{background:#2AABEE}
.s-wa{background:#25D366}
.s-o{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.s-o svg{color:var(--copper)}

/* ---------- sticky cart bar (home) ---------- */
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;align-items:center;gap:12px;background:var(--dark);color:#fff;padding:11px 16px calc(11px + var(--safe));transform:translateY(130%);transition:transform .24s}
.sticky.on{transform:translateY(0)}
.sticky .tot{flex:1}
.sticky .tot b{display:block;font-size:16px;font-weight:800}
.sticky .tot span{display:block;font-size:12px;color:#A79383}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:calc(88px + var(--safe));transform:translateX(-50%) translateY(16px);z-index:200;display:flex;align-items:center;gap:9px;background:var(--dark);color:#fff;border-radius:10px;padding:11px 15px;font-size:13.5px;font-weight:600;max-width:min(92vw,420px);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast svg{width:17px;height:17px;color:#8ED9B4;flex:none}
</style>
</head>

<header>
  <div class="wrap hbar">
    <div class="hlogo"><svg viewBox="0 0 100 100"><use href="#stag"/></svg><b>PIZZA CHICAGO</b></div>
    <div class="langsw" role="group" aria-label="Язык">
      <button id="lang-ru" aria-pressed="true" onclick="setLang('ru')">RU</button>
      <button id="lang-av" aria-pressed="false" onclick="setLang('av')">АВ</button>
    </div>
    <button class="hcart" id="hcart" hidden onclick="openOrder(0)">
      <svg viewBox="0 0 24 24"><use href="#i-cart"/></svg><span id="hcnt">0</span>
    </button>
  </div>
</header>

<main>
  <div class="hero">
    <div class="wrap">
      <svg class="em" viewBox="0 0 100 100"><use href="#stag"/></svg>
      <h1>PIZZA CHICAGO</h1>
      <p data-i="heroSub"></p>
      <div class="halal"><svg viewBox="0 0 24 24"><use href="#i-shield"/></svg><span data-i="halal"></span></div>
      <div class="cta">
        <button class="btn btn-main" onclick="openMenu()">
          <svg viewBox="0 0 24 24"><use href="#i-pizza"/></svg><span data-i="btnMenu"></span>
        </button>
        <a class="btn btn-out" href="tel:+79669849831">
          <svg viewBox="0 0 24 24"><use href="#i-phone"/></svg><span data-i="btnCall"></span>
        </a>
      </div>
    </div>
  </div>

  <section class="blk"><div class="wrap">
    <h2 data-i="howT"></h2>
    <p class="sub" data-i="howS"></p>
    <div class="how">
      <div><span class="n">1</span><div><b data-i="how1T"></b><small data-i="how1D"></small></div></div>
      <div><span class="n">2</span><div><b data-i="how2T"></b><small data-i="how2D"></small></div></div>
      <div><span class="n">3</span><div><b data-i="how3T"></b><small data-i="how3D"></small></div></div>
    </div>
  </div></section>

  <section class="blk"><div class="wrap">
    <h2 data-i="delT"></h2>
    <p class="sub" data-i="delS"></p>
    <div class="cards">
      <div class="card">
        <svg class="ic" viewBox="0 0 24 24"><use href="#i-scooter"/></svg>
        <h3 data-i="courT"></h3><p data-i="courD"></p>
      </div>

const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const P = id => MENU.find(m=>m.id===id);
const count = () => cart.reduce((s,c)=>s+c.qty,0);
const total = () => cart.reduce((s,c)=>s+P(c.id).p[c.size]*c.qty,0);

/* ---------- toast ---------- */
let tTimer;
function toast(msg){
  const el=document.getElementById("toast");
  document.getElementById("toastTxt").textContent=msg;
  el.classList.add("on"); clearTimeout(tTimer);
  tTimer=setTimeout(()=>el.classList.remove("on"),2100);
}

/* ---------- language ---------- */
function setLang(l){
  LANG=l;
  document.getElementById("lang-ru").setAttribute("aria-pressed",l==="ru");
  document.getElementById("lang-av").setAttribute("aria-pressed",l==="av");
  document.querySelectorAll("[data-i]").forEach(el=>el.textContent=T(el.dataset.i));
  renderFilters(); renderMenu(); renderTotals();
  if(document.getElementById("orderPanel").classList.contains("on")) renderOrder();
  toast(T("tLang"));
}

/* ================================================================
   5. MENU PANEL
   ================================================================ */
const FILTERS=[["all","fAll"],["classic","fClassic"],["meat","fMeat"],["chicken","fChicken"],["cheese","fCheese"],["spicy","fSpicy"],["sea","fSea"]];

function openMenu(){
  document.getElementById("menuPanel").classList.add("on");
  document.body.classList.add("locked");
  renderFilters(); renderMenu(); renderTotals();
  toast(T("tMenu"));
}
function closeMenu(){
  document.getElementById("menuPanel").classList.remove("on");
  if(!document.getElementById("orderPanel").classList.contains("on")) document.body.classList.remove("locked");
  toast(T("tHome"));
}
function renderFilters(){
  document.getElementById("filters").innerHTML = FILTERS.map(([k,l])=>
    `<button class="chip" aria-pressed="${filter===k}" onclick="setFilter('${k}')">${esc(T(l))}</button>`).join("");
}
function setFilter(k){
  filter=k; renderFilters(); renderMenu();
  document.querySelector(".panel.on .pbody").scrollTop=0;
  toast(T("menuT")+" · "+T(FILTERS.find(f=>f[0]===k)[1]));
}
function renderMenu(){
  const list=MENU.filter(p=>filter==="all"||p.t.includes(filter));
  document.getElementById("mlist").innerHTML=list.map(p=>{
    const si=picked[p.id]??CONFIG.defaultSize;
    return `<article class="item">
      <h3>${esc(p.n)}${p.hot?`<span class="hot">${esc(T("hot"))}</span>`:""}</h3>
      <p class="d">${esc(p.d)}</p>
      <div class="sizes" role="group">
        ${CONFIG.sizes.map((s,i)=>`<button class="size" aria-pressed="${i===si}" onclick="pickSize('${p.id}',${i})"><b>${s}</b><span>${p.p[i]}</span></button>`).join("")}
      </div>
      <div class="addrow">
        <div class="price">${p.p[si].toLocaleString("ru-RU")} ${CONFIG.currency} <i>· ${CONFIG.sizes[si]} ${esc(T("cm"))}</i></div>
        <button class="add" onclick="addItem('${p.id}')">${esc(T("add"))}</button>
      </div>
    </article>`;
  }).join("");
}
function pickSize(id,i){
  picked[id]=i; renderMenu();
  const p=P(id);
  toast(p.n+" · "+CONFIG.sizes[i]+" "+T("cm")+" — "+money(p.p[i]));
}
function addItem(id){
  const si=picked[id]??CONFIG.defaultSize;
  const f=cart.find(c=>c.id===id&&c.size===si);
  if(f) f.qty++; else cart.push({id,size:si,qty:1});
  toast(T("tAdd")+" "+P(id).n+" "+CONFIG.sizes[si]+" "+T("cm"));
  renderTotals();
  if(document.getElementById("orderPanel").classList.contains("on")) renderOrder();
}

/* ---------- totals everywhere ---------- */
function renderTotals(){
  const n=count(), t=money(total());
  const hc=document.getElementById("hcart"), sb=document.getElementById("sticky"), mf=document.getElementById("menuFoot");
  hc.hidden = n===0;
  document.getElementById("hcnt").textContent=n;
  sb.classList.toggle("on", n>0);
  document.getElementById("sTot").textContent=t;
  document.getElementById("sCnt").textContent=n+" "+T("items");
  mf.style.display = n>0 ? "flex" : "none";
  document.getElementById("mTot").textContent=t;
  document.getElementById("mCnt").textContent=n+" "+T("items");
}

/* ================================================================
   6. ORDER PANEL — 4 qadam
   ================================================================ */
function openOrder(s){
  step=s??0;
  document.getElementById("orderPanel").classList.add("on");
  document.body.classList.add("locked");
  renderOrder(); toast(T("tCart"));
}
function closeOrder(){
  document.getElementById("orderPanel").classList.remove("on");
  if(!document.getElementById("menuPanel").classList.contains("on")) document.body.classList.remove("locked");
}
function go(s){
  if(s===1&&!cart.length) return;
  if(s===2&&!order.way){ toast(T("tPickWay")); return; }
  if(s===3&&!validate()) return;
  step=s; renderOrder();
  document.querySelector("#orderPanel .pbody").scrollTop=0;
  toast(T(["tCart","tWay","tData","tSend"][s]));
}
function back(){
  if(step===0){ closeOrder(); toast(T("tHome")); return; }
  step--; renderOrder();
  document.querySelector("#orderPanel .pbody").scrollTop=0;
  toast(T("tBack"));
}
function changeQty(i,d){
  cart[i].qty+=d;
  if(cart[i].qty<=0){ toast(T("tDel")+" "+P(cart[i].id).n); cart.splice(i,1); }
  renderTotals(); renderOrder();
}
function clearCart(){ cart=[]; step=0; toast(T("tCleared")); renderTotals(); renderOrder(); }
function setWay(w){ order.way=w; renderOrder(); toast(w==="delivery"?T("wayDelT"):T("wayPickT")); }
function setField(k,v){ order[k]=v; }
function setPay(v){ order.pay=v; renderOrder(); }

function validate(){
  let ok=true;
  const need=["name","phone"]; if(order.way==="delivery") need.push("addr");
  need.forEach(k=>{
    const el=document.getElementById("f_"+k); if(!el) return;
    const bad=!el.value.trim();
    el.closest("label").classList.toggle("bad",bad);
    if(bad) ok=false;
  });
  if(!ok) toast(T("tFill"));
  return ok;
}

function renderOrder(){
  const body=document.getElementById("oBody"), foot=document.getElementById("oFoot");
  document.getElementById("oWhere").textContent=T("whereOrder");
  document.getElementById("oName").textContent=T("s"+step);
  document.querySelectorAll("#stepBar i").forEach((el,i)=>el.classList.toggle("done",i<=step));
  const totRow = `<div class="tot"><b>${money(total())}</b><span>${count()} ${esc(T("items"))}</span></div>`;

  if(step===0){
    if(!cart.length){
      body.innerHTML=`<div class="empty"><svg viewBox="0 0 24 24"><use href="#i-cart"/></svg>
        <b>${esc(T("emptyT"))}</b><span>${esc(T("emptyD"))}</span></div>`;
      foot.innerHTML=`<button class="btn btn-main" style="width:100%" onclick="closeOrder();openMenu()">${esc(T("emptyBtn"))}</button>`;
      return;
    }
    body.innerHTML=cart.map((c,i)=>{
      const p=P(c.id);
      return `<div class="line">
        <div class="nm"><b>${esc(p.n)}</b><span>${CONFIG.sizes[c.size]} ${esc(T("cm"))} · ${p.p[c.size]} ${CONFIG.currency}</span></div>
        <div class="qty"><button onclick="changeQty(${i},-1)" aria-label="−">−</button><b>${c.qty}</b><button onclick="changeQty(${i},1)" aria-label="+">+</button></div>
        <div class="linesum">${(p.p[c.size]*c.qty).toLocaleString("ru-RU")}</div></div>`;
    }).join("")+
    `<button class="btn btn-out" style="width:100%;margin-top:8px;color:var(--gray)" onclick="clearCart()">${esc(T("clear"))}</button>`;
    foot.innerHTML=totRow+`<button class="btn btn-main" onclick="go(1)">${esc(T("next"))}</button>`;
    return;
  }

  if(step===1){
    body.innerHTML=`
      <button class="choice" aria-pressed="${order.way==="delivery"}" onclick="setWay('delivery')">
        <svg viewBox="0 0 24 24"><use href="#i-scooter"/></svg>
        <div><b>${esc(T("wayDelT"))}</b><span>${esc(T("wayDelD"))}</span></div></button>
      <button class="choice" aria-pressed="${order.way==="pickup"}" onclick="setWay('pickup')">
        <svg viewBox="0 0 24 24"><use href="#i-bag"/></svg>
        <div><b>${esc(T("wayPickT"))}</b><span>${esc(T("wayPickD"))}</span></div></button>`;
    foot.innerHTML=totRow+`<button class="btn btn-main" onclick="go(2)" ${order.way?"":"disabled"}>${esc(T("next"))}</button>`;
    return;
  }

  if(step===2){
    const del=order.way==="delivery";
    body.innerHTML=`
      <label class="f"><span class="lb">${esc(T("fName"))}</span>
        <input id="f_name" value="${esc(order.name)}" placeholder="${esc(T("fNameP"))}" oninput="setField('name',this.value)">
        <span class="err">${esc(T("reqName"))}</span></label>
      <label class="f"><span class="lb">${esc(T("fPhone"))}</span>
        <input id="f_phone" type="tel" inputmode="tel" value="${esc(order.phone)}" placeholder="${esc(T("fPhoneP"))}" oninput="setField('phone',this.value)">
        <span class="err">${esc(T("reqPhone"))}</span></label>
      ${del?`<label class="f"><span class="lb">${esc(T("fAddr"))}</span>
        <input id="f_addr" value="${esc(order.addr)}" placeholder="${esc(T("fAddrP"))}" oninput="setField('addr',this.value)">
        <span class="err">${esc(T("reqAddr"))}</span></label>`:""}
      <label class="f"><span class="lb">${esc(del?T("fTime"):T("fTime2"))}</span>
        <input id="f_time" value="${esc(order.time)}" placeholder="${esc(T("fTimeP"))}" oninput="setField('time',this.value)"></label>
      <div class="lb" style="font-size:13px;font-weight:600;color:var(--gray);margin-bottom:6px">${esc(T("fPay"))}</div>
      <div class="paywrap">
        ${["payCash","payCard","payTrans"].map(k=>`<button class="chip" aria-pressed="${order.pay===T(k)}" onclick="setPay(${JSON.stringify(T(k))})">${esc(T(k))}</button>`).join("")}
      </div>
      <label class="f"><span class="lb">${esc(T("fNote"))}</span>
        <textarea id="f_note" placeholder="${esc(T("fNoteP"))}" oninput="setField('note',this.value)">${esc(order.note)}</textarea></label>`;
    foot.innerHTML=totRow+`<button class="btn btn-main" onclick="go(3)">${esc(T("next"))}</button>`;
    return;
  }

  const txt=orderText();
  body.innerHTML=`
    <p style="margin:0 0 3px;font-size:17px;font-weight:800">${esc(T("doneT"))}</p>
    <p style="margin:0 0 13px;font-size:13.5px;color:var(--gray)">${esc(T("doneD"))}</p>
    <div class="preview">${esc(txt)}</div>
    <div class="sendrow">
      <button class="send s-tg" onclick="sendTelegram()"><svg viewBox="0 0 24 24"><use href="#i-tg"/></svg>
        <span>${esc(T("sendTg"))}<small>${esc(T("sendTgS"))}</small></span></button>
      <a class="send s-wa" target="_blank" rel="noopener" href="${waHref(txt)}"><svg viewBox="0 0 24 24"><use href="#i-wa"/></svg>
        <span>${esc(T("sendWa"))}<small>${esc(T("sendWaS"))}</small></span></a>
      <button class="send s-o" onclick="copyText()"><svg viewBox="0 0 24 24"><use href="#i-copy"/></svg>
        <span>${esc(T("copy"))}<small>${esc(T("copyS"))}</small></span></button>
      <a class="send s-o" href="tel:${CONFIG.phone}"><svg viewBox="0 0 24 24"><use href="#i-phone"/></svg>
        <span>${esc(T("callBtn"))}<small>${CONFIG.phonePretty}</small></span></a>
    </div>`;
  foot.innerHTML=totRow+`<button class="btn btn-out" onclick="back()">${esc(T("back"))}</button>`;
}

/* ================================================================
   7. TEXT + SEND
   ================================================================ */
function orderText(){
  const L=[];
  L.push("🍕 "+T("oTitle"));
  L.push("———————————————");
  cart.forEach((c,i)=>{
    const p=P(c.id);
    L.push(`${i+1}. ${p.n} — ${CONFIG.sizes[c.size]} ${T("cm")} × ${c.qty} = ${p.p[c.size]*c.qty} ${CONFIG.currency}`);
  });
  L.push("———————————————");
  L.push(`${T("oTotal")}: ${total()} ${CONFIG.currency}`);
  L.push("");
  L.push(`${T("oWay")}: ${order.way==="delivery"?T("wayDelT"):T("wayPickT")}`);
  if(order.name)  L.push(`${T("oNameL")}: ${order.name}`);
  if(order.phone) L.push(`${T("oPhoneL")}: ${order.phone}`);
  if(order.way==="delivery"&&order.addr) L.push(`${T("oAddrL")}: ${order.addr}`);
  if(order.way==="pickup") L.push(`${T("oAddrL")}: ${CONFIG.address}`);
  if(order.time) L.push(`${T("oTimeL")}: ${order.time}`);
  if(order.pay)  L.push(`${T("oPayL")}: ${order.pay}`);
  if(order.note) L.push(`${T("oNoteL")}: ${order.note}`);
  L.push(""); L.push("— "+T("oSite"));
  return L.join("\n");
}
const waHref = txt => "https://wa.me/"+CONFIG.whatsapp+"?text="+encodeURIComponent(txt);

async function copyText(){
  const txt=orderText();
  try{ await navigator.clipboard.writeText(txt); }
  catch(e){
    const ta=document.createElement("textarea");
    ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); }catch(_){}
    document.body.removeChild(ta);
  }
  toast(T("tCopied"));
}
async function sendTelegram(){
  await copyText();
  setTimeout(()=>window.open("https://t.me/"+CONFIG.telegram,"_blank","noopener"),300);
}

/* ================================================================
   8. START
   ================================================================ */
document.getElementById("yr").textContent=new Date().getFullYear();
document.getElementById("mapLink").href=CONFIG.mapUrl;
document.getElementById("mapLink2").href=CONFIG.mapUrl;
setLang("ru");
renderTotals();
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape") return;
  if(document.getElementById("orderPanel").classList.contains("on")) closeOrder();
  else if(document.getElementById("menuPanel").classList.contains("on")) closeMenu();
});
</script>

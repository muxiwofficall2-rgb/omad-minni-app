<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>Omad Tour</title>
<style>
:root{--bg:#f3f6ff;--cd:#fff;--tx:#0e1b33;--mu:#66758f;--ac:#1e63ff;--on:#fff;--ln:#dde5f5}
[data-t=green]{--bg:#0a1410;--cd:#12241b;--tx:#e6f4ec;--mu:#86ad9a;--ac:#2fd07a;--on:#03200e;--ln:#1d3a2c}
[data-t=dark]{--bg:#0d0d0f;--cd:#19191c;--tx:#f1f1f3;--mu:#9696a0;--ac:#8ab4ff;--on:#001a40;--ln:#2a2a2f}
*{box-sizing:border-box;margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{background:var(--bg);color:var(--tx);min-height:100dvh}
#v{max-width:520px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.c{padding:24px 20px;display:flex;flex-direction:column;gap:14px;flex:1;justify-content:center}
h1{font-size:26px;line-height:1.2}p{color:var(--mu);line-height:1.45}
button,input,select{font-size:17px;border-radius:14px;border:1px solid var(--ln);padding:14px;background:var(--cd);color:var(--tx);width:100%}
button.p{background:var(--ac);color:var(--on);border:0;font-weight:600}
button.l{background:none;border:0;color:var(--mu);font-size:15px}
.b{flex:1;overflow:auto;padding:18px 16px 90px}
.cd{background:var(--cd);border:1px solid var(--ln);border-radius:18px;padding:16px;margin-bottom:14px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g button{text-align:left;font-weight:600;padding:18px 14px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:var(--cd);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav div{display:flex;width:100%;max-width:520px}
nav button{border:0;background:none;border-radius:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--mu);padding:10px 0}
nav button.on{color:var(--ac)}svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.m{max-width:80%;padding:10px 14px;border-radius:18px;margin:6px 0;white-space:pre-wrap}
.me{background:var(--ac);color:var(--on);margin-left:auto}.ad{background:var(--cd);border:1px solid var(--ln)}
.row{display:flex;gap:8px;margin:10px 0}.row button{width:auto}
.r{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 0}.r select{width:auto}
</style></head><body><div id="v"></div>
<script>
const C={phone:'+7XXXXXXXXXX',wa:'7XXXXXXXXXX',tg:'omad_tour',max:'https://max.ru/',vapid:'PASTE_VAPID_PUBLIC_KEY'};
const L={
ru:{it:'Установите приложение',id:'Нажмите «Поделиться» → «На экран Домой». Так вы получите ответы и уведомления.',at:'Разрешите уведомления',ad:'Мы сообщим, когда придёт ответ или изменится статус заявки.',ab:'Разрешить',sk:'Позже',lt:'Вход',ph:'Номер телефона',sc:'Получить код',co:'Код из SMS',cd:'Код придёт по SMS. Введите его — вход произойдёт автоматически.',hi:'Здравствуйте',sv:'Услуги',fl:'Авиабилеты',vi:'Виза',no:'Нотариус',pr:'Копи-центр',mn:'Меню',ch:'Чат',ca:'Звонок',se:'Настройки',la:'Язык',th:'Оформление',ts:'Системная',tb:'Синяя',tg:'Тёмная, зелёные акценты',td:'Тёмная нейтральная',nt:'Уведомления',on:'Включены',of:'Выключены',en:'Включить',lo:'Выйти',wr:'Сообщение…',se2:'Отправить',er:'Ошибка. Попробуйте ещё раз',rq:'Мои заявки',ny:'Пока заявок нет. Напишите нам в чат.',em:'Напишите нам — ответим здесь и в Telegram.',cl:'Позвонить'},
uz:{it:'Ilovani o‘rnating',id:'«Ulashish» → «Bosh ekranga qo‘shish» tugmasini bosing. Shunda javob va bildirishnomalar keladi.',at:'Bildirishnomaga ruxsat bering',ad:'Javob kelganda yoki ariza holati o‘zgarganda xabar beramiz.',ab:'Ruxsat berish',sk:'Keyinroq',lt:'Kirish',ph:'Telefon raqami',sc:'Kod olish',co:'SMS’dagi kod',cd:'Kod SMS orqali keladi. Kiriting — kirish avtomatik bo‘ladi.',hi:'Assalomu alaykum',sv:'Xizmatlar',fl:'Aviachiptalar',vi:'Viza',no:'Notarius',pr:'Kopi markaz',mn:'Menyu',ch:'Chat',ca:'Qo‘ng‘iroq',se:'Sozlamalar',la:'Til',th:'Ko‘rinish',ts:'Tizim',tb:'Ko‘k',tg:'Qorong‘i, yashil urg‘u',td:'Qorong‘i neytral',nt:'Bildirishnomalar',on:'Yoqilgan',of:'O‘chirilgan',en:'Yoqish',lo:'Chiqish',wr:'Xabar…',se2:'Yuborish',er:'Xatolik. Qayta urinib ko‘ring',rq:'Mening arizalarim',ny:'Hozircha ariza yo‘q. Chatda yozing.',em:'Bizga yozing — javobni shu yerda va Telegramda beramiz.',cl:'Qo‘ng‘iroq qilish'},
tk:{it:'Programmany guruň',id:'«Paýlaş» → «Baş ekrana goş» düwmesine basyň. Şeýdip jogaplary we habarnamalary alarsyňyz.',at:'Habarnamalara rugsat beriň',ad:'Jogap gelende ýa-da arzaňyzyň ýagdaýy üýtgände habar bereris.',ab:'Rugsat bermek',sk:'Soňra',lt:'Girmek',ph:'Telefon belgisi',sc:'Kod almak',co:'SMS-däki kod',cd:'Kod SMS arkaly gelýär. Giriziň — giriş awtomatiki bolýar.',hi:'Salam',sv:'Hyzmatlar',fl:'Awiabilet',vi:'Wiza',no:'Notarius',pr:'Kopi merkezi',mn:'Menýu',ch:'Çat',ca:'Jaň',se:'Sazlamalar',la:'Dil',th:'Görnüş',ts:'Ulgam',tb:'Gök',tg:'Gara, ýaşyl öwüşginli',td:'Gara neýtral',nt:'Habarnamalar',on:'Açyk',of:'Ýapyk',en:'Açmak',lo:'Çykmak',wr:'Habar…',se2:'Ibermek',er:'Ýalňyşlyk. Gaýtadan synanyşyň',rq:'Meniň arzalarym',ny:'Entek arza ýok. Çatda ýazyň.',em:'Bize ýazyň — jogaby şu ýerde we Telegramda bereris.',cl:'Jaň etmek'}};
const st=JSON.parse(localStorage.st||'{}'),S={l:st.l||'ru',t:st.t||'system',tok:localStorage.tok,tab:'mn',ph:''};
const $=s=>document.querySelector(s),T=k=>L[S.l][k],V=$('#v');
const save=()=>localStorage.st=JSON.stringify({l:S.l,t:S.t});
const theme=()=>document.documentElement.dataset.t=S.t==='system'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'blue'):S.t;
const api=async(u,d)=>{const r=await fetch('/api/'+u,{method:'POST',headers:{'content-type':'application/json',Authorization:'Bearer '+(S.tok||'')},body:JSON.stringify(d)});if(r.status===401&&S.tok){out();return Promise.reject(401)}return r.ok?r.json():Promise.reject(r.status)};
const out=()=>{localStorage.removeItem('tok');S.tok=null;go()};
const std=navigator.standalone||matchMedia('(display-mode:standalone)').matches||location.search.includes('dev');
const hasN='Notification' in window;
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');
async function sub(){try{const reg=await navigator.serviceWorker.ready,p='='.repeat((4-C.vapid.length%4)%4),
k=Uint8Array.from(atob((C.vapid+p).replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0)),
s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:k});S.sub=s.toJSON();if(S.tok)await api('chat',{action:'sub',sub:S.sub})}catch(e){}}
function go(){theme();clearInterval(S.iv);
 if(!std)return gate();
 if(!S.tok&&hasN&&Notification.permission==='default'&&!localStorage.skip)return perm();
 if(!S.tok)return login();
 app()}
const lang=()=>`<div class="row" style="justify-content:center">${['ru','uz','tk'].map(x=>`<button class="l" style="${S.l===x?'color:var(--ac);font-weight:700':''}" onclick="S.l='${x}';save();go()">${x.toUpperCase()}</button>`).join('')}</div>`;
function gate(){V.innerHTML=`<div class="c"><h1>${T('it')}</h1><p>${T('id')}</p>${lang()}</div>`}
function perm(){V.innerHTML=`<div class="c"><h1>${T('at')}</h1><p>${T('ad')}</p><button class="p" id="ok">${T('ab')}</button><button class="l" id="sk">${T('sk')}</button></div>`;
 $('#ok').onclick=async()=>{await Notification.requestPermission();go()};$('#sk').onclick=()=>{localStorage.skip=1;go()}}
function login(){V.innerHTML=`<div class="c"><h1>${T('lt')}</h1><input id="p" type="tel" inputmode="tel" autocomplete="tel" placeholder="${T('ph')}" value="${S.ph}"><button class="p" id="s">${T('sc')}</button><p id="h"></p>${lang()}</div>`;
 $('#s').onclick=async()=>{S.ph=$('#p').value;try{const d=await api('auth',{action:'send',phone:S.ph});if(d.dev)console.log('DEV',d.dev);
  V.innerHTML=`<div class="c"><h1>${T('co')}</h1><p>${T('cd')}</p><input id="c" inputmode="numeric" autocomplete="one-time-code" maxlength="6" autofocus></div>`;
  $('#c').oninput=async e=>{if(e.target.value.length===6)try{const d=await api('auth',{action:'verify',phone:S.ph,code:e.target.value});localStorage.tok=S.tok=d.token;if(hasN&&Notification.permission==='granted')sub();go()}catch(x){e.target.value='';$('#c').placeholder=T('er')}}}catch(x){$('#h').textContent=T('er')}}}
const I={mn:'<path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/>',ch:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',ca:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',se:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'};
function app(){V.innerHTML=`<div class="b" id="b"></div><nav><div>${['mn','ch','ca','se'].map(k=>`<button class="${S.tab===k?'on':''}" onclick="S.tab='${k}';app()" style="flex:1"><svg viewBox="0 0 24 24">${I[k]}</svg>${T(k)}</button>`).join('')}</div></nav>`;
 clearInterval(S.iv);({mn:menu,ch:chat,ca:call,se:sets})[S.tab]();
 if(hasN&&Notification.permission==='granted'&&!S.sub)sub()}
function menu(){$('#b').innerHTML=`<div class="cd"><h1>${T('hi')}</h1><p>+${S.ph.replace(/\D/g,'')||'…'}</p></div>
<div class="cd"><b>${T('rq')}</b><p style="margin-top:6px">${T('ny')}</p></div><h3 style="margin:6px 4px 10px">${T('sv')}</h3>
<div class="g">${[['fl','✈️'],['vi','🛂'],['no','📜'],['pr','🖨️']].map(([k,e])=>`<button onclick="S.pre='${T(k)}: ';S.tab='ch';app()">${e}<br>${T(k)}</button>`).join('')}</div>`}
async function chat(){$('#b').innerHTML=`<div id="ms"></div><div class="row" style="position:sticky;bottom:0"><input id="t" placeholder="${T('wr')}"><button class="p" id="x">${T('se2')}</button></div>`;
 if(S.pre){$('#t').value=S.pre;S.pre=''}
 const load=async()=>{try{const d=await api('chat',{action:'list'});S.ph=d.phone;$('#ms').innerHTML=d.msgs.length?d.msgs.map(m=>`<div class="m ${m.from==='me'?'me':'ad'}"></div>`).join(''):`<p>${T('em')}</p>`;
  [...$('#ms').children].forEach((n,i)=>n.textContent=d.msgs[i]?.text)}catch(e){}};
 $('#x').onclick=async()=>{const v=$('#t').value.trim();if(!v)return;$('#t').value='';try{await api('chat',{action:'send',text:v});load()}catch(e){$('#t').value=v}};
 load();S.iv=setInterval(load,5000)}
function call(){const n=C.phone.replace(/\D/g,'');$('#b').innerHTML=[[`tel:${C.phone}`,T('cl')+' '+C.phone],[`https://wa.me/${C.wa}`,'WhatsApp'],[`https://t.me/${C.tg}`,'Telegram'],[C.max,'Max']].map(([h,t])=>`<a href="${h}" style="text-decoration:none"><button class="cd" style="margin-bottom:12px;font-weight:600">${t}</button></a>`).join('')}
function sets(){const sel=(id,o,v)=>`<select id="${id}">${o.map(([k,t])=>`<option value="${k}"${k===v?' selected':''}>${t}</option>`).join('')}</select>`;
 const g=hasN&&Notification.permission==='granted';
 $('#b').innerHTML=`<div class="cd"><div class="r"><b>${T('la')}</b>${sel('l',[['ru','Русский'],['uz','Oʻzbekcha'],['tk','Türkmençe']],S.l)}</div>
<div class="r"><b>${T('th')}</b>${sel('t',[['system',T('ts')],['blue',T('tb')],['green',T('tg')],['dark',T('td')]],S.t)}</div>
<div class="r"><b>${T('nt')}</b>${g?`<span>${T('on')}</span>`:`<button class="p" id="n" style="width:auto">${T('en')}</button>`}</div></div><button id="o">${T('lo')}</button>`;
 $('#l').onchange=e=>{S.l=e.target.value;save();app()};$('#t').onchange=e=>{S.t=e.target.value;save();theme();app()};
 if(!g&&hasN)$('#n').onclick=async()=>{await Notification.requestPermission();await sub();app()};$('#o').onclick=out}
matchMedia('(prefers-color-scheme:dark)').onchange=theme;go();
</script></body></html>

<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test</title>
    <style>
        body { background: #07091a; color: white; font-family: sans-serif; padding: 20px; }
        .screen { display: none; }
        .screen.active { display: block; }
        button { padding: 15px; background: #C13584; color: white; border: none; border-radius: 10px; margin-top: 10px; width: 100%; font-size: 16px; }
    </style>
</head>
<body>

    <!-- BOSH SAHIFA -->
    <div class="screen active" id="screen-home">
        <h2>Bosh sahifa</h2>
        <button onclick="nav('screen-visa')">Viza bo'limiga o'tish</button>
        <button onclick="nav('screen-flight')">Aviabilet bo'limiga o'tish</button>
    </div>

    <!-- VIZA SAHIFASI -->
    <div class="screen" id="screen-visa">
        <h2>Viza bo'limi</h2>
        <button onclick="nav('screen-home')">Orqaga qaytish</button>
    </div>

    <!-- AVIABILET SAHIFASI -->
    <div class="screen" id="screen-flight">
        <h2>Aviabilet bo'limi</h2>
        <button onclick="nav('screen-home')">Orqaga qaytish</button>
    </div>

    <!-- LOGIKA -->
    <script>
        function nav(id) {
            // Barcha ekranlarni yashirish
            document.querySelectorAll('.screen').forEach(function(s) {
                s.classList.remove('active');
            });
            // Faqat kerakli ekranni ko'rsatish
            document.getElementById(id).classList.add('active');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07091a" />
    <title>OMAD TOUR</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ============================================================
           DESIGN TOKENS (Premium Dizayn)
        ============================================================ */
        :root {
            --bg-1: #07091a; --bg-2: #0e1230;
            --surface: rgba(255,255,255,0.06);
            --stroke: rgba(255,255,255,0.1);
            --text: #ffffff; --text-dim: rgba(255,255,255,0.6);
            --accent-1: #8B2C6A; --accent-2: #C13584; --accent-3: #E1306C;
            --grad-primary: linear-gradient(135deg, #8B2C6A 0%, #C13584 55%, #E1306C 100%);
            --radius-md: 16px; --radius-lg: 22px;
        }
        body.light {
            --bg-1: #f5f6fc; --bg-2: #eef0fa;
            --surface: rgba(255,255,255,0.75); --stroke: rgba(10,14,39,0.1);
            --text: #0a0e27; --text-dim: rgba(10,14,39,0.65);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-1); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; height: 100vh; overflow: hidden; }
        
        /* Orqa fon effektlari */
        .bg-orbs { position: fixed; inset: 0; z-index: 0; background: radial-gradient(ellipse at top, var(--bg-2), var(--bg-1) 60%); }
        
        /* Ilova korpusi */
        .app { position: relative; z-index: 1; height: 100vh; max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; }
        .topbar { display: flex; justify-content: space-between; padding: 20px; align-items: center; }
        .icon-btn { background: var(--surface); border: 1px solid var(--stroke); border-radius: 50%; width: 40px; height: 40px; color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .main { flex: 1; overflow-y: auto; padding: 0 20px 100px; }
        
        /* Ekranlar */
        .screen { display: none; animation: slideUp 0.4s ease; }
        .screen.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: none; } }

        /* Bosh sahifa */
        .home-logo { width: 100px; height: 100px; border-radius: 30px; background: var(--grad-primary); margin: 20px auto; display: flex; align-items: center; justify-content: center; box-shadow: 0 20px 60px -15px rgba(193,53,132,0.6); cursor: pointer; }
        .home-logo svg { width: 50px; height: 50px; color: white; }
        .quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .quick-card { background: var(--surface); border: 1px solid var(--stroke); padding: 20px; border-radius: var(--radius-lg); text-align: left; cursor: pointer; }
        .quick-card-icon { width: 40px; height: 40px; border-radius: 12px; background: var(--grad-primary); color: white; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; }
        .quick-card-title { font-weight: 700; font-size: 15px; color: var(--text); }
        .quick-card-sub { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

        /* Formalarga */
        .page-head { display: flex; align-items: center; margin: 10px 0 20px; gap: 12px; }
        .back-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--surface); border: 1px solid var(--stroke); color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .page-title { font-size: 22px; font-weight: 800; }
        .field-wrap { margin-bottom: 16px; }
        .field-label { font-size: 12px; font-weight: 600; color: var(--text-dim); margin-bottom: 8px; display: block; text-transform: uppercase; }
        .field { width: 100%; padding: 16px; border-radius: var(--radius-md); background: var(--surface); border: 1px solid var(--stroke); color: var(--text); font-size: 16px; }
        .btn-primary { width: 100%; padding: 16px; border-radius: var(--radius-md); background: var(--grad-primary); color: white; border: none; font-weight: 700; font-size: 16px; cursor: pointer; }
        
        /* Natija ekrani */
        .fullscreen-result { position: fixed; inset: 0; z-index: 9999; background: #4CAF50; color: white; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .fullscreen-result .btn-close { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.2); color: white; border: none; border-radius: 50%; width: 40px; height: 40px; font-size: 20px; cursor: pointer; }
        .result-icon { width: 80px; height: 80px; background: white; color: #4CAF50; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; margin-bottom: 20px; }

        /* Toast */
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 12px 24px; border-radius: 12px; opacity: 0; transition: 0.3s; z-index: 10000; }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

<div class="bg-orbs"></div>
<div class="app">
    <div class="topbar">
        <div style="font-weight:800; letter-spacing:2px;">OMAD TOUR</div>
        <button class="icon-btn" onclick="toggleTheme()">🌙</button>
    </div>

    <div class="main">
        <!-- BOSH SAHIFA -->
        <div class="screen active" id="screen-home">
            <div class="home-logo" id="logoClick">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 16l20-8-9 9-2 5-2-6-7z"/></svg>
            </div>
            <h2 style="text-align:center;">Xush kelibsiz</h2>
            
            <div class="quick-grid">
                <div class="quick-card" onclick="nav('screen-flight')">
                    <div class="quick-card-icon">✈️</div>
                    <div class="quick-card-title">Aviabiletlar</div>
                    <div class="quick-card-sub">Eng qulay narxlar</div>
                </div>
                <div class="quick-card" onclick="nav('screen-visa')">
                    <div class="quick-card-icon">🛂</div>
                    <div class="quick-card-title">Viza</div>
                    <div class="quick-card-sub">Javobni tekshirish</div>
                </div>
            </div>
        </div>

        <!-- VIZA BO'LIMI -->
        <div class="screen" id="screen-visa">
            <div class="page-head">
                <button class="back-btn" onclick="nav('screen-home')">←</button>
                <div class="page-title">Viza tekshiruvi</div>
            </div>
            <div class="field-wrap">
                <label class="field-label">Telefon raqamingiz</label>
                <input type="text" id="visaPhone" class="field" placeholder="+998901234567" />
            </div>
            <div class="field-wrap">
                <label class="field-label">Barkod raqami</label>
                <input type="text" id="visaBarcode" class="field" placeholder="79675310924" />
            </div>
            <button class="btn-primary" onclick="sendVisaRequest()">So'rov yuborish</button>
            
            <!-- Test uchun (keyinchalik o'chiriladi) -->
            <button class="btn-primary" style="margin-top:20px; background:#22c55e;" onclick="showResult()">🧪 Test: Natija tayyor</button>
        </div>

        <!-- AVIABILET BO'LIMI -->
        <div class="screen" id="screen-flight">
            <div class="page-head">
                <button class="back-btn" onclick="nav('screen-home')">←</button>
                <div class="page-title">Aviabiletlar</div>
            </div>
            <div class="field-wrap">
                <label class="field-label">Qayerdan</label>
                <input type="text" id="flightFrom" class="field" placeholder="Sankt-Peterburg" />
            </div>
            <div class="field-wrap">
                <label class="field-label">Qayerga</label>
                <input type="text" id="flightTo" class="field" placeholder="Samarqand" />
            </div>
            <div class="field-wrap">
                <label class="field-label">Sana (YYYY-MM-DD)</label>
                <input type="date" id="flightDate" class="field" />
            </div>
            <button class="btn-primary" onclick="sendFlightRequest()">Bilet izlash</button>
        </div>
    </div>
</div>

<!-- NATIJA EKRANI (2-rasm) -->
<div class="fullscreen-result" id="resultScreen">
    <button class="btn-close" onclick="document.getElementById('resultScreen').style.display='none'">✕</button>
    <div class="result-icon">✓</div>
    <h1>Услуга оформлена</h1>
    <p>Желаем приятного полета!</p>
</div>

<!-- TOAST BILDIRISHNOMA -->
<div class="toast" id="toast">Xabar</div>

<!-- SOZLAMALAR -->
<script src="./config.js"></script>

<!-- LOGIKA -->
<script>
    // 1. SUPABASE ULANISHI
    let supabase = null;
    if (window.SUPABASE_URL && window.SUPABASE_URL !== "BU_YERGA_SUPABASE_URL_KELADI") {
        supabase = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
        console.log("✅ Supabase ulandi");
    } else {
        console.warn("⚠️ Supabase kalitlari kiritilmagan. config.js ni to'ldiring.");
    }

    // 2. SAHIFALAR ORASIDA O'TISH
    function nav(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    // 3. TUNGI/KUNDUZGI REJIM
    function toggleTheme() {
        document.body.classList.toggle('light');
    }

    // 4. TOAST XABARNOMA
    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    }

    // 5. VIZA SO'ROVINI BAZAGA YUBORISH
    async function sendVisaRequest() {
        const phone = document.getElementById('visaPhone').value;
        const barcode = document.getElementById('visaBarcode').value;

        if(!phone || !barcode) return showToast("Iltimos, barcha maydonlarni to'ldiring!");
        if(!supabase) return showToast("Xatolik: Baza ulanmagan!");

        const { data, error } = await supabase
            .from('visa_requests')
            .insert([{ phone: phone, barcode: barcode, status: 'pending' }]);

        if (error) {
            showToast("Xatolik: " + error.message);
        } else {
            showToast("So'rov muvaffaqiyatli yuborildi!");
            document.getElementById('visaPhone').value = '';
            document.getElementById('visaBarcode').value = '';
        }
    }

    // 6. AVIABILET SO'ROVINI YUBORISH
    async function sendFlightRequest() {
        const from = document.getElementById('flightFrom').value;
        const to = document.getElementById('flightTo').value;
        const date = document.getElementById('flightDate').value;

        if(!from || !to || !date) return showToast("Iltimos, barcha maydonlarni to'ldiring!");
        if(!supabase) return showToast("Xatolik: Baza ulanmagan!");

        const { data, error } = await supabase
            .from('flight_requests')
            .insert([{ from_city: from, to_city: to, date: date, status: 'pending' }]);

        if (error) {
            showToast("Xatolik: " + error.message);
        } else {
            showToast("Bilet so'rovi bazaga tushdi!");
            document.getElementById('flightFrom').value = '';
            document.getElementById('flightTo').value = '';
        }
    }

    // 7. NATIJA EKRANINI KO'RSATISH (Test)
    function showResult() {
        document.getElementById('resultScreen').style.display = 'flex';
    }

    // 8. ADMIN PANEL (Logoni 5 marta bosish)
    let clickCount = 0;
    document.getElementById('logoClick').addEventListener('click', () => {
        clickCount++;
        setTimeout(() => clickCount = 0, 2000);
        if (clickCount === 5) {
            const pass = prompt("Admin paroli:");
            if (pass === "Omad2022") showToast("Admin panelga xush kelibsiz! (Keyingi versiyada)");
        }
    });
</script>
</body>
</html>

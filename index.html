<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>Omad Tour</title>
<style>
:root{--bg:#e9f0ff;--cd:#fff;--tx:#061230;--mu:#3a4c78;--ln:#c9d6f4;--ac:#0b57ff;--ac2:#00aaff;--on:#fff;--sh:0 10px 28px rgba(11,87,255,.16)}
[data-t=green]{--bg:#05100a;--cd:#0d1d14;--tx:#f2fff8;--mu:#a9cdb9;--ln:#21432f;--ac:#2bdc86;--ac2:#10b6a6;--on:#03170c;--sh:0 10px 28px rgba(0,0,0,.55)}
[data-t=dark]{--bg:#000;--cd:#131316;--tx:#fff;--mu:#b9b9c2;--ln:#2b2b32;--ac:#6aa6ff;--ac2:#9a7bff;--on:#000;--sh:0 10px 28px rgba(0,0,0,.6)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:500 16px/1.45 -apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
#v{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
h1{font-size:28px;line-height:1.15;margin:0;font-weight:800;letter-spacing:-.025em}
h3{font-size:19px;font-weight:800;margin:24px 4px 12px}
p{margin:0;color:var(--mu)}
button{font-family:inherit;cursor:pointer}
.i{stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.c{flex:1;display:flex;flex-direction:column;justify-content:center;padding:28px 22px;gap:16px;max-width:520px;width:100%;margin:0 auto}
.logo{width:84px;height:84px;border-radius:26px;display:grid;place-items:center;color:var(--on);background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:var(--sh)}
.p{border:0;border-radius:16px;padding:16px;font-weight:800;font-size:17px;color:var(--on);background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:var(--sh);width:100%;display:flex;gap:8px;align-items:center;justify-content:center}
.l{background:none;border:0;color:var(--ac);font-weight:800;font-size:15px;padding:10px}
input{width:100%;font-weight:700;font-size:18px;color:var(--tx);background:var(--cd);border:2px solid var(--ln);border-radius:16px;padding:15px 16px;outline:0}
input:focus{border-color:var(--ac)}
input::placeholder{color:var(--mu);opacity:.8}
.cd{background:var(--cd);border:1px solid var(--ln);border-radius:22px;padding:18px;box-shadow:var(--sh);margin-bottom:14px}
.b{flex:1;overflow:auto;padding:18px 16px 24px;max-width:560px;width:100%;margin:0 auto}
.b.f{padding:0;display:flex;flex-direction:column;overflow:hidden}
nav{flex:none;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--cd);border-top:1px solid var(--ln)}
nav div{display:flex;max-width:560px;margin:0 auto}
nav button{flex:1;border:0;background:none;color:var(--mu);font-weight:800;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:2px 0}
nav span{width:58px;height:32px;border-radius:16px;display:grid;place-items:center}
nav .on{color:var(--tx)}
nav .on span{background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--on)}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:24px;color:var(--on);background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:var(--sh)}
.hero p{color:inherit;opacity:.95;font-weight:600}
.hero .bg{position:absolute;right:-18px;top:-10px;opacity:.16;transform:rotate(8deg)}
.pill{display:inline-flex;align-items:center;gap:7px;margin-top:14px;padding:7px 12px;border-radius:20px;background:rgba(255,255,255,.22);font-weight:800;font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;background:#2ee07a;box-shadow:0 0 0 3px rgba(46,224,122,.3)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.t{display:flex;flex-direction:column;gap:12px;text-align:left;background:var(--cd);border:1px solid var(--ln);border-radius:22px;padding:16px;color:var(--tx);box-shadow:var(--sh)}
.t b{font-size:16px;font-weight:800;display:block}.t small{color:var(--mu);font-weight:600;font-size:13px}
.q{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--h1),var(--h2))}
.row{display:flex;align-items:center;gap:14px}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--on);background:linear-gradient(135deg,var(--ac),var(--ac2))}
.nt{display:flex;gap:12px;align-items:flex-start;color:var(--mu);font-weight:600;font-size:14px}.nt .i{color:var(--ac)}
.ch{display:flex;gap:12px;align-items:center;padding:12px 16px;background:var(--cd);border-bottom:1px solid var(--ln)}
.ch small{display:flex;align-items:center;gap:6px;color:var(--mu);font-weight:600;font-size:13px}.ch .dot{width:8px;height:8px;box-shadow:none}
.ms{flex:1;overflow:auto;padding:16px 14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:80%;padding:10px 14px 6px;border-radius:20px;background:var(--cd);border:1px solid var(--ln);overflow-wrap:anywhere;font-weight:600}
.m.me{align-self:flex-end;background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--on);border:0;border-bottom-right-radius:6px}
.m.ad{border-bottom-left-radius:6px}
.m small{display:block;text-align:right;font-size:11px;opacity:.75;margin-top:2px}
.m .ph{display:flex;gap:6px;align-items:center;font-weight:800;margin-bottom:2px}
.cp{display:flex;gap:8px;overflow:auto;padding:8px 14px}
.cp button{flex:none;display:flex;gap:6px;align-items:center;border:1px solid var(--ln);background:var(--cd);color:var(--tx);border-radius:20px;padding:9px 13px;font-weight:800;font-size:14px}
.cp .i{color:var(--ac)}
.cm{display:flex;gap:8px;align-items:center;padding:6px 12px 12px}
.cm input{border-radius:26px;padding:12px 18px;font-size:16px}
.rb{width:48px;height:48px;border-radius:50%;border:0;flex:none;display:grid;place-items:center}
.rb.s{background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--on);box-shadow:var(--sh)}
.rb.o{background:var(--cd);border:1px solid var(--ln);color:var(--tx)}
.lk{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--tx);padding:14px 0;border-bottom:1px solid var(--ln)}.lk:last-child{border:0}
.lk b{display:block;font-weight:800}.lk small{color:var(--mu);font-weight:600;font-size:13px}.lk>.i:last-child{margin-left:auto;color:var(--mu)}
.r{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--ln);font-weight:800}.r:last-child{border:0}
.ri{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--bg);color:var(--ac);flex:none}
.sg{display:flex;background:var(--bg);border-radius:14px;padding:4px;gap:4px;margin-top:10px}
.sg button{flex:1;border:0;background:none;color:var(--mu);font-weight:800;font-size:14px;padding:10px;border-radius:11px}
.sg .on{background:var(--cd);color:var(--tx);box-shadow:0 2px 8px rgba(0,0,0,.18)}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.sw button{border:2px solid var(--ln);border-radius:16px;background:var(--cd);color:var(--tx);padding:10px;font-weight:800;font-size:13px;text-align:left}
.sw .on{border-color:var(--ac)}.sw i{display:block;height:36px;border-radius:10px;margin-bottom:8px}
.tg{width:52px;height:30px;border-radius:15px;background:var(--ln);position:relative;border:0;margin-left:auto}
.tg.on{background:var(--ac)}.tg::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}.tg.on::after{left:25px}
.out{width:100%;border:2px solid var(--ln);background:var(--cd);color:#e5484d;border-radius:16px;padding:14px;font-weight:800;font-size:16px;display:flex;gap:8px;justify-content:center}
.step{display:flex;gap:14px;align-items:center;background:var(--cd);border:1px solid var(--ln);border-radius:18px;padding:14px;font-weight:700}
.cd b{display:block;font-weight:800}.cd small{display:block;color:var(--mu);font-weight:600;font-size:14px;line-height:1.35;margin-top:2px}
[data-t=pink]{--bg:#fbf0f6;--cd:#fff;--tx:#2b0d21;--mu:#69485d;--ln:#ecd2e1;--ac:#862a65;--ac2:#c43b8f;--on:#fff;--sh:0 10px 28px rgba(134,42,101,.2)}
[data-t=mint]{--bg:#ecfaf2;--cd:#fff;--tx:#06281a;--mu:#3d6552;--ln:#c4e8d4;--ac:#0a8f55;--ac2:#27c98a;--on:#fff;--sh:0 10px 28px rgba(10,143,85,.2)}
.lg{width:68px;height:68px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;box-shadow:0 4px 14px rgba(0,0,0,.18)}.lg img{width:48px;height:48px}
.bk{display:flex;align-items:center;gap:4px;border:0;background:none;color:var(--ac);font-weight:800;font-size:16px;padding:6px 2px;margin-bottom:8px}
button.lk{width:100%;background:none;border:0;border-bottom:1px solid var(--ln);text-align:left;font:inherit;color:var(--tx)}
.drop{display:block;border:2px dashed var(--ln);border-radius:20px;padding:22px 14px;text-align:center;cursor:pointer;color:var(--ac)}.drop b{color:var(--tx)}.drop small{display:block;color:var(--mu);font-weight:600;font-size:13px}.drop .i{margin:0 auto 6px;display:block}
.big{width:100%;border-radius:14px;display:block;margin-bottom:8px;max-height:62vh;object-fit:contain;background:var(--bg)}
.m.im{width:88%;max-width:88%}.chip{display:flex;gap:8px;align-items:center;font-weight:800}
#c{text-align:center;font-size:30px;letter-spacing:.4em;padding:16px 8px}
</style></head><body><div id="v"></div>

function menu(){if(S.pg)return subpage();const sv=[['fl','#0b57ff','#00aaff'],['vi','#7c3aed','#c084fc'],['no','#f59e0b','#fbbf24'],['pr','#059669','#2dd4bf']];
$('#b').innerHTML=`<div class="hero"><div class="row"><span class="lg"><img src="${LOGO}" alt=""></span><span><p style="font-weight:700">${T('hi')}</p><h1>Omad Tour</h1></span></div><div class="pill"><span class="dot"></span>${T('on')}</div></div>${setup()}
<h3>${T('rq')}</h3><div class="cd"><div class="row"><div class="av">${ic('user',24)}</div><p style="font-weight:600">${T('ny')}</p></div><button class="p" style="margin-top:14px" data-a="tab" data-v="ch">${ic('ch',22)}${T('wc')}</button></div>
<h3 style="margin-top:6px">${T('sv')}</h3><div class="g">${sv.map(([k,a,b])=>`<button class="t" data-a="svc" data-v="${k}" style="--h1:${a};--h2:${b}"><span class="q">${ic(k,26)}</span><span><b>${T(k)}</b><small>${T(k+'d')}</small></span></button>`).join('')}</div>
<div class="cd nt" style="margin-top:14px">${ic('shield',22)}<span>${T('nt')}</span></div>`}
const tm=t=>new Date(t).toLocaleTimeString(S.l==='ru'?'ru-RU':'uz-UZ',{hour:'2-digit',minute:'2-digit'});
const shrink=(f,mx=1400,q=.78)=>new Promise((r,j)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',q))};im.onerror=j;im.src=URL.createObjectURL(f)});
async function chat(){$('#b').innerHTML=`<div class="ch"><div class="av" style="background:#fff;border:1px solid var(--ln)"><img src="${LOGO}" width="30" height="30" alt=""></div><div><b>Omad Tour</b><small><span class="dot"></span>${T('cn')}</small></div></div><div class="ms" id="ms"></div>
<div class="cp">${['fl','vi','no','pr'].map(k=>`<button data-a="chip" data-v="${k}">${ic(k,18)}${T(k)}</button>`).join('')}</div>
<div class="cm"><label class="rb o" aria-label="photo">${ic('cam',22)}<input type="file" id="f" accept="image/*" hidden></label><input id="t" placeholder="${T('wr')}"><button class="rb s" id="x" aria-label="send">${ic('send',22)}</button></div>`;
if(S.pre){$('#t').value=S.pre;S.pre=''}
const mk=m=>{const d=document.createElement('div');d.className='m '+(m.from==='me'?'me':'ad')+(m.img?' im':'');if(m.kind){const p=document.createElement('div');p.className='ph';p.innerHTML=ic(m.file?'file':'cam',18);p.append(T(m.kind==='visa'?'vi':'pr')+(m.phone?' · '+m.phone:''));d.append(p)}if(m.img){const i=document.createElement('img');i.className='big';i.src=m.img;i.alt='';d.append(i)}if(m.file){const c=document.createElement('div');c.className='chip';c.innerHTML=ic('file',18);c.append(m.file);d.append(c)}if(m.text)d.append(m.text);if(m.t){const s=document.createElement('small');s.textContent=tm(m.t);d.append(s)}return d};
const load=async()=>{let sv=[];try{sv=(await api('chat',{action:'list'})).msgs||[]}catch(e){}const ms=$('#ms');if(!ms)return;const all=[...S.loc,...sv.filter(x=>x.from!=='me')].sort((a,b)=>a.t-b.t);ms.replaceChildren(...(all.length?all:[{from:'ad',text:T('em')}]).map(mk));ms.scrollTop=1e9};
const send=async f=>{const v=$('#t').value.trim();if(!v&&!f)return;$('#t').value='';const m={from:'me',text:v,t:Date.now()};let data;if(f){try{data=await shrink(f,1600,.8);m.img=await shrink(f,900,.7)}catch(e){return}}addLoc(m);api('chat',{action:'send',text:v,img:data}).catch(()=>{});load()};
$('#x').onclick=()=>send();$('#t').onkeydown=e=>e.key==='Enter'&&send();
$('#f').onchange=e=>{const f=e.target.files[0];if(f)send(f);e.target.value=''};

<h3>${T('of')}</h3><div class="cd" style="padding:4px 18px">${[T('o1'),T('o2')].map(o=>`<div class="lk"><span class="ri">${ic('pin',22)}</span><b>${o}</b></div>`).join('')}</div>`}

$('#b').innerHTML=`<div class="cd"><div class="row"><div class="av">${ic('user',24)}</div><b style="font-size:19px;font-weight:800">${S.ph?'+'+S.ph.replace(/\D/g,''):'Omad Tour'}</b></div></div>
<div class="cd"><div class="r" style="border:0;padding-top:0"><span class="ri">${ic('globe',22)}</span>${T('la')}</div>${lang()}</div>
<div class="cd"><div class="r" style="border:0;padding-top:0"><span class="ri">${ic('pal',22)}</span>${T('th')}</div><div class="sw">${sw.map(([k,l,bg])=>`<button class="${S.t===k?'on':''}" data-a="th" data-v="${k}"><i style="background:${bg}"></i>${T(l)}</button>`).join('')}</div></div>
<button class="out" data-a="out">${ic('out',22)}${T('lo')}</button>`}
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a)return;const k=a.dataset.a,v=a.dataset.v;
if(k==='tab'){S.tab=v;S.pg=null;app()}else if(k==='open')openSub(v);else if(k==='back'){S.d>0?history.back():backNav()}else if(k==='lang'){S.l=v;save();go()}else if(k==='th'){S.t=v;save();theme();app()}else if(k==='svc')openSub(v);else if(k==='chip'){$('#t').value=T(v)+': ';$('#t').focus()}else if(k==='out')out();else if(k==='inst'&&dp)dp.prompt();else if(k==='push'&&hasN)Notification.requestPermission().then(()=>sub()).then(()=>app())});
matchMedia('(prefers-color-scheme:dark)').onchange=theme;go();
